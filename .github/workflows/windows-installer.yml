name: Windows installer (personal)

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/windows-installer.yml

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      # Plain checkout: actions/checkout's credential cleanup trips on the vendored .repos gitlinks.
      - name: Checkout
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Spectre-mitigated MSVC libs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) { exit 1 }

      - name: Install dependencies
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build installer
        shell: bash
        run: node scripts/build-desktop-artifact.ts --platform win --target nsis --arch x64 --verbose

      - uses: actions/upload-artifact@v4
        with:
          name: t3code-windows-installer
          path: release/*.exe
          if-no-files-found: error
          compression-level: 0
