name: Android APK (sideload)

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/android-apk.yml

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APP_VARIANT: preview
      T3CODE_MOBILE_UPDATES_ENABLED: "0"
      EXPO_NO_GIT_STATUS: "1"
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Prebuild Android project
        working-directory: apps/mobile
        run: npx expo prebuild --clean --platform android

      - name: Build release APK (arm64)
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: t3code-android-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          compression-level: 0
